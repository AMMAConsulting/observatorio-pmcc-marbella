<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatorio del Plan Municipal contra el Cambio Climático · Marbella</title>
<meta name="description" content="Seguimiento del Plan Municipal contra el Cambio Climático de Marbella: emisiones, movilidad eléctrica, agua, clima y territorio, con fuentes oficiales que se actualizan solas.">

<!-- Tipografía del kit. Si no carga, la pila de respaldo mantiene el diseño. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232a78d6'/%3E%3Cpath d='M5 6v12h13' stroke='white' stroke-width='1.9' fill='none' stroke-linecap='round'/%3E%3Cpath d='m8 14 3-3 3 3 4-6' stroke='white' stroke-width='1.9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;650&display=swap" rel="stylesheet">

<!-- Kit: no se toca por observatorio -->
<link rel="stylesheet" href="assets/obs.css">

<!-- Ajustes de marca de ESTE observatorio. Es el único sitio donde tocar color. -->
<style>
  :root { --brand: #2a78d6; --brand-ink: #1c5cab; --brand-soft: #eaf2fd; }
  /* Tabla fija de actuaciones (sección Plan de acción): no es la tabla
     plegable de las tarjetas, que el kit oculta hasta que se pide. */
  .pmcc-actuaciones { overflow-x: auto; margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .pmcc-actuaciones table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .pmcc-actuaciones th, .pmcc-actuaciones td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .pmcc-actuaciones th { font-weight: 600; color: var(--ink-2); background: var(--brand-soft); }
  .pmcc-actuaciones tr:last-child td { border-bottom: 0; }
  .pmcc-actuaciones td:last-child { color: var(--ink-mut); font-style: italic; }
</style>
</head>
<body>

<div id="obs-app"></div>

<!-- Librería de gráficas -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<!-- Kit -->
<script src="assets/obs-charts.js"></script>
<script src="assets/obs-ui.js"></script>
<!-- Datos (los escribe pipeline/build_data.py) -->
<script src="data/data.js"></script>
<!-- Declaración de ESTE observatorio -->
<script src="app.js"></script>

</body>
</html>
