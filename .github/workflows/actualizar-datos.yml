name: Actualizar datos

# Cada día a las 07:30 UTC: el embalse y la lluvia (observatorio hídrico, que
# actualiza a las 08:15 hora peninsular) y la foto diaria de los puntos de
# recarga. Las matriculaciones de la DGT solo se descargan cuando hay un mes
# nuevo (caché en pipeline/cache). Se puede lanzar a mano desde Actions.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r pipeline/requirements.txt

      - name: Recolectar
        # Si el colector aborta (datos peores que los publicados) el paso falla
        # y data.js se queda como estaba. Es el comportamiento que se quiere.
        run: python pipeline/build_data.py

      - name: Publicar si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.js pipeline/cache
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "Datos actualizados $(date -u +%Y-%m-%d)"
          git push
