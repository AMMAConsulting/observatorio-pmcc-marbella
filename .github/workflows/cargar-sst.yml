name: Cargar temperatura del mar

# Carga inicial de la serie diaria de temperatura del mar (NOAA OISST, desde
# 1982). El servidor tarda minutos por ano, asi que se rellena cada 2 horas con
# un tope de 25 minutos. Una vez completa, la Action diaria la mantiene.
on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rellenar
        run: python pipeline/cargar_sst.py 1500
      - name: Guardar lo descargado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/cache/sst_diaria.json
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Temperatura del mar: carga de la serie $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
